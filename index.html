<!DOCTYPE html>
<html lang="en" dir="rtl">

    <link rel="stylesheet" href="styles/general.css">

<body>
    <div class="sign_in_modal">
        <span class="modal_exit">x</span>
        <form action="">

            <label for="admin_email">ایمیل:</label>
            <input type="email" name="" id="admin_email">
            <label for="admin_password">کلمه عبور:</label>
            <input type="password" name="" id="admin_password">

        </form>
        <button class="sign_in_button">ورود</button>

    </div>



    <div class="overlay"></div>

            <div class="pulse_loader"></div>

    <div class="title_icon">
        <div class="main_menu_icon">
            <img src="images/defualt_animal.png">

        </div>
        <h1 class="main_page_title">وب اپ ثبت گونه های مشاهده شده</h1>
    </div>
    <main class="hero_section">
        <div class="menu_btns">
            <a href="list.html?category=birds" class="menu_btn" id="#btn_bird">
                پرندگان
            </a>
            <a href="list.html?category=insects" class="menu_btn" id="#btn_insect">
                حشرات
            </a>
        </div>
    </main>

    <span class="open_sign_in_modal_button" title="Sign in as admin">
        <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="currentColor" class="bi bi-person"
            viewBox="0 0 16 16">

                d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
        </svg>
